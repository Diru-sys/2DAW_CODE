<!doctype html>
<html lang="es">
<head>
    <title>Concesionario AutoDrive</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="estilos.css" />
</head>

<body>
    <!-- Menú de Navegación -->
    <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container-fluid">
            <div class="navbar-header">
                <a class="navbar-brand" href="#">AutoDrive</a>
            </div>
            <ul class="nav navbar-nav">
                <li><a href="#" onclick="gestionFormularios('frmAltaVehiculo')">Alta de Vehículo</a></li>
                <li><a href="#" onclick="gestionFormularios('frmActualizarKms')">Actualizar Kms</a></li>
                <li><a href="#" onclick="gestionFormularios('frmListadoElectricos')">Listado Eléctricos</a></li>
                <li><a href="#" onclick="gestionFormularios('frmListadoCombustion')">Listado Combustión</a></li>
                <li><a href="#" onclick="gestionFormularios('TotalVehiculos')">Total Vehículos en Oferta</a></li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid" id="formularios">
        
        <!-- Formulario 1: Alta de Vehículo -->
        <form class="form-horizontal" name="frmAltaVehiculo" id="frmAltaVehiculo">
            <fieldset>
                <legend>Alta de Vehículo</legend>
                <div class="form-group">
                    <label class="col-xs-4 control-label" for="txtBastidor">Nº Bastidor</label>
                    <div class="col-xs-4">
                        <input id="txtBastidor" name="txtBastidor" placeholder="Nº Bastidor" class="form-control input-md" type="text" />
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-xs-4 control-label" for="txtKms">Kilometraje</label>
                    <div class="col-xs-4">
                        <input id="txtKms" name="txtKms" placeholder="Kilometraje" class="form-control input-md" type="text" />
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-xs-4 control-label" for="txtMarca">Marca</label>
                    <div class="col-xs-4">
                        <input id="txtMarca" name="txtMarca" placeholder="Marca" class="form-control input-md" type="text" />
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-xs-4 control-label" for="txtModelo">Modelo</label>
                    <div class="col-xs-4">
                        <input id="txtModelo" name="txtModelo" placeholder="Modelo" class="form-control input-md" type="text" />
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-xs-4 control-label">Tipo de Vehículo</label>
                    <div class="col-xs-4">
                        <div class="radio">
                            <label><input name="rbtTipoVehiculo" id="rbtTipo-E" value="electrico" checked type="radio" />Eléctrico</label>
                        </div>
                        <div class="radio">
                            <label><input name="rbtTipoVehiculo" id="rbtTipo-C" value="combustion" type="radio" />Combustión</label>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-xs-4 control-label" for="txtAutonomia">Autonomía (km - sólo Eléctricos)</label>
                    <div class="col-xs-4">
                        <input id="txtAutonomia" name="txtAutonomia" placeholder="Autonomía en km" class="form-control input-md" type="text" />
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-xs-4 control-label" for="selectCombustible">Combustible (sólo Combustión)</label>
                    <div class="col-xs-4">
                        <select id="selectCombustible" name="selectCombustible" class="form-control">
                            <option value="Gasolina">Gasolina</option>
                            <option value="Diesel">Diesel</option>
                            <option value="Hibrido">Híbrido</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-xs-4 col-xs-offset-4">
                        <input type="button" id="btnAceptarAlta" class="btn btn-primary" value="Aceptar" onclick="aceptarAltaVehiculo()" />
                    </div>
                </div>
            </fieldset>
        </form>

        <!-- Formulario 2: Actualización de Kilometraje -->
        <form class="form-horizontal" name="frmActualizarKms" id="frmActualizarKms">
            <fieldset>
                <legend>Actualizar Kilometraje de Vehículo</legend>
                <div class="form-group">
                    <label class="col-xs-4 control-label" for="txtBastidorKms">Nº Bastidor</label>
                    <div class="col-xs-4">
                        <input id="txtBastidorKms" name="txtBastidorKms" placeholder="Bastidor" class="form-control input-md" type="text" />
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-xs-4 control-label" for="txtNuevoKms">Nuevos Kms</label>
                    <div class="col-xs-4">
                        <input id="txtNuevoKms" name="txtNuevoKms" placeholder="Nuevos Kms" class="form-control input-md" type="text" />
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-xs-4 col-xs-offset-4">
                        <input type="button" class="btn btn-primary" value="Aceptar" onclick="aceptarActualizarKms()" />
                    </div>
                </div>
            </fieldset>
        </form>

        <!-- Formulario 3: Listado de Eléctricos -->
        <form class="form-horizontal" name="frmListadoElectricos" id="frmListadoElectricos">
            <fieldset>
                <legend>Listado de Vehículos Eléctricos</legend>
                <div class="form-group">
                    <label class="col-xs-4 control-label" for="txtAutonomiaMin">Autonomía Mínima (km)</label>
                    <div class="col-xs-4">
                        <input id="txtAutonomiaMin" name="txtAutonomiaMin" placeholder="Autonomía mínima" class="form-control input-md" type="text" />
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-xs-4 col-xs-offset-4">
                        <input type="button" class="btn btn-primary" value="Aceptar" onclick="aceptarListadoElectricos()" />
                    </div>
                </div>
            </fieldset>
        </form>

        <!-- Formulario 4: Listado de Combustión -->
        <form class="form-horizontal" name="frmListadoCombustion" id="frmListadoCombustion">
            <fieldset>
                <legend>Listado de Vehículos de Combustión</legend>
                <div class="form-group">
                    <label class="col-xs-4 control-label" for="selectCombustibleFiltro">Tipo de Combustible</label>
                    <div class="col-xs-4">
                        <select id="selectCombustibleFiltro" name="selectCombustibleFiltro" class="form-control">
                            <option value="Gasolina">Gasolina</option>
                            <option value="Diesel">Diesel</option>
                            <option value="Hibrido">Híbrido</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-xs-4 col-xs-offset-4">
                        <input type="button" class="btn btn-primary" value="Aceptar" onclick="aceptarListadoCombustion()" />
                    </div>
                </div>
            </fieldset>
        </form>

    </div>

    <!-- Carga de Scripts -->
    <script type="text/javascript" src="objetos.js"></script>
    <script type="text/javascript" src="codigo.js"></script>
</body>
</html>
