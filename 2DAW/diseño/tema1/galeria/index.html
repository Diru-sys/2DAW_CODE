<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de fotografías</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="galeria" aria-label="Galería de paisajes">
        <figure class="foto paisaje">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=1000&amp;q=85" alt="Cumbres montañosas al atardecer">
            <figcaption>Paisaje</figcaption>
        </figure>
        <figure class="foto ciudad">
            <img src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&amp;fit=crop&amp;w=600&amp;q=85" alt="Casas de colores sobre los acantilados de la costa italiana">
            <figcaption>Ciudad costera</figcaption>
        </figure>
        <figure class="foto flores">
            <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&amp;fit=crop&amp;w=600&amp;q=85" alt="Flores iluminadas por el sol">
            <figcaption>Flores</figcaption>
        </figure>
        <figure class="foto arquitectura">
            <img src="https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&amp;fit=crop&amp;w=600&amp;q=85" alt="Arquitectura monumental de Roma">
            <figcaption>Arquitectura</figcaption>
        </figure>
        <figure class="foto bosque">
            <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&amp;fit=crop&amp;w=600&amp;q=85" alt="Luz del sol entre los árboles de un bosque">
            <figcaption>Bosque</figcaption>
        </figure>
        <figure class="foto playa">
            <img src="https://images.unsplash.com/photo-1473116763249-2faaef81ccda?auto=format&amp;fit=crop&amp;w=1000&amp;q=85" alt="Olas sobre una playa de arena">
            <figcaption>Playa</figcaption>
        </figure>
        <figure class="foto puente">
            <img src="https://images.unsplash.com/photo-1501594907352-04cda38ebc29?auto=format&amp;fit=crop&amp;w=1000&amp;q=85" alt="Puente Golden Gate sobre la bahía de San Francisco">
            <figcaption>Puente</figcaption>
        </figure>
        <figure class="foto montana">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&amp;fit=crop&amp;w=600&amp;q=85" alt="Lago rodeado de montañas">
            <figcaption>Montaña</figcaption>
        </figure>
    </main>
</body>
</html>
