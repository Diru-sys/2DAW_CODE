<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Grid · Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <h1>MiApp</h1>
            <section class="inicio"></section>
            <section class="estadisticas"></section>
            <section class="proyecto"></section>
            <section class="equipo"></section>
            <section class="ajustes"></section>
        </aside>
        <header class="cabecera">
            <h1>Bienvenida, Laura</h1>
            <p>Aquí tienes un resumen de tu actividad</p>
        </header>
        <section class="tarjeta proyectos" aria-label="Proyectos">
            <h2>Proyectos</h2>
            <p>12</p>
        </section>
        <section class="tarjeta tareas" aria-label="Tareas">
            <h2>Tareas</h2>
            <p>8</p>
        </section>
        <section class="tarjeta equipo" aria-label="Equipo">
            <h2>Equipo</h2>
            <p>5</p>
        </section>
        <section class="tarjeta actividad">
            <h2>Actividad reciente</h2>
            <article id="1">Nuevo proyecto creado</article>
            <article id="2">Tarea completada</article>
            <article id="3">Comentario en el foro</article>
        </section>
        <section class="tarjeta notas">
            <h2>Notas</h2>
            <p id="notas">Revisar tareas pendientes y preparar la reunión semanal</p>
        </section>
    </div>
</body>
</html>
